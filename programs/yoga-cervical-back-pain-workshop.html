<style>
/* ── Split-hero override for Cervical & Back Pain Workshop ── */
.cbp-hero {
  min-height: 90vh;
  background: linear-gradient(135deg, #0f0d0a 0%, #1e1408 50%, #0f0d0a 100%);
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  position: relative;
  overflow: hidden;
  padding-top: 76px;
}
/* subtle ambient glow */
.cbp-hero::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at 25% 60%, rgba(201,168,76,0.08) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 30%, rgba(200,98,42,0.06) 0%, transparent 55%);
  pointer-events: none;
}
/* ── left panel ── */
.cbp-hero-left {
  position: relative;
  z-index: 2;
  padding: 5rem 4vw 5rem 6vw;
  display: flex;
  flex-direction: column;
  gap: 0;
  animation: fadeUp 1.1s ease both;
}
/* price badge */
.cbp-price-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 1.6rem;
  font-family: 'Jost', sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(201,168,76,0.8);
}
.cbp-price-badge::before {
  content: '';
  display: inline-block;
  width: 28px;
  height: 1px;
  background: var(--gold);
}
.cbp-tag {
  background: rgba(201,168,76,0.12);
  border: 1px solid rgba(201,168,76,0.3);
  color: var(--gold);
  padding: 0.25rem 0.7rem;
  border-radius: 2px;
  font-size: 0.68rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}
/* title */
.cbp-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(2.8rem, 5vw, 4.2rem);
  font-weight: 300;
  line-height: 1.05;
  color: var(--ivory);
  font-style: italic;
  margin: 0 0 1rem;
}
/* meta pills */
.cbp-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 0.6rem;
  margin-bottom: 1.8rem;
}
.cbp-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-family: 'Jost', sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  color: rgba(245,239,224,0.75);
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  padding: 0.35rem 0.85rem;
  border-radius: 20px;
}
/* desc */
.cbp-desc {
  font-family: 'Jost', sans-serif;
  font-size: 0.95rem;
  line-height: 1.85;
  color: rgba(245,239,224,0.75);
  margin-bottom: 2rem;
  max-width: 480px;
  font-weight: 300;
}
/* offer strip */
.cbp-offer {
  display: inline-flex;
  align-items: center;
  gap: 0.9rem;
  background: linear-gradient(90deg, rgba(200,98,42,0.18), rgba(201,168,76,0.12));
  border: 1px solid rgba(201,168,76,0.25);
  border-radius: 4px;
  padding: 0.7rem 1.3rem;
  margin-bottom: 2rem;
  font-family: 'Jost', sans-serif;
}
.cbp-offer-price-new {
  font-size: 1.6rem;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.02em;
}
.cbp-offer-price-old {
  font-size: 0.85rem;
  color: rgba(245,239,224,0.4);
  text-decoration: line-through;
}
.cbp-offer-label {
  font-size: 0.72rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(245,239,224,0.5);
}
/* scroll hint */
.cbp-scroll-hint {
  position: absolute;
  bottom: 1.8rem;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  color: rgba(201,168,76,0.45);
  font-family: 'Jost', sans-serif;
  font-size: 0.62rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  animation: scrollBounce 2.2s ease-in-out infinite;
  cursor: pointer;
  z-index: 3;
}
.cbp-scroll-hint svg {
  width: 18px;
  height: 18px;
  stroke: rgba(201,168,76,0.45);
  fill: none;
  stroke-width: 1.5;
}
@keyframes scrollBounce {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.5; }
  50%       { transform: translateX(-50%) translateY(6px); opacity: 1; }
}
/* CTA */
.cbp-cta {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
  background: var(--saffron);
  color: var(--ivory);
  padding: 0.95rem 2.4rem;
  font-family: 'Jost', sans-serif;
  font-size: 0.82rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
  box-shadow: 0 4px 24px rgba(200,98,42,0.35);
}
.cbp-cta:hover {
  background: var(--deep-saffron, #b05a1a);
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(200,98,42,0.5);
}
/* ── right panel (poster image) ── */
.cbp-hero-right {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 5rem 6vw 5rem 3vw;
}
.cbp-poster-wrap {
  position: relative;
  width: 100%;
  max-width: 400px;
}
/* decorative golden border frame */
.cbp-poster-wrap::before {
  content: '';
  position: absolute;
  inset: -10px;
  border: 1px solid rgba(201,168,76,0.2);
  border-radius: 4px;
  pointer-events: none;
}
.cbp-poster-wrap::after {
  content: '';
  position: absolute;
  inset: -20px;
  border: 1px solid rgba(201,168,76,0.08);
  border-radius: 6px;
  pointer-events: none;
}
/* glow behind poster */
.cbp-poster-glow {
  position: absolute;
  inset: -40px;
  background: radial-gradient(ellipse, rgba(201,168,76,0.15) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}
.cbp-poster-img {
  width: 100%;
  border-radius: 3px;
  display: block;
  box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(201,168,76,0.15);
  position: relative;
  z-index: 1;
}
/* ── RESPONSIVE ── */
@media (max-width: 860px) {
  .cbp-hero {
    grid-template-columns: 1fr;
    min-height: auto;
  }
  .cbp-hero-right {
    padding: 0 6vw 4rem;
  }
  .cbp-poster-wrap {
    max-width: 320px;
    margin: 0 auto;
  }
  .cbp-hero-left {
    padding: 4rem 6vw 2rem;
  }
}
</style>
<script src="../js/i18n.js"></script>

      <span>2-Day Online Workshop</span>

    <h1 class="cbp-title" id="prog-hero-title"></h1>
    <div class="cbp-meta" id="prog-hero-label"></div>
    <p class="cbp-desc" id="prog-hero-desc"></p>
    <div class="cbp-offer">
      <div>
        <div class="cbp-offer-price-new">₹199</div>

      <div class="cbp-poster-glow"></div>

  <!-- Scroll hint -->
  <div class="cbp-scroll-hint" onclick="document.getElementById('prog-benefits-section').scrollIntoView({behavior:'smooth'})">

  </div>
</section>

<!-- BENEFITS STRIP -->
<section id="prog-benefits-section" class="about-strip">
  <div class="about-strip-inner" style="grid-template-columns: 1fr; max-width: 700px;">
    <div class="reveal">

      <div class="about-highlights" id="prog-benefits-grid"></div>

<!-- REGISTRATION FORM -->
<div id="prog-form-container"></div>
<footer id="site-footer"></footer>

<script>
/* Post-render: convert flat label text → styled pill chips for the cbp-meta container */
(function () {
  const meta = document.getElementById('prog-hero-label');
  if (!meta) return;
  const raw = meta.textContent.trim();
  if (!raw) return;
  const pills = raw.split('·').map(s => s.trim()).filter(Boolean);
  meta.innerHTML = pills.map(p =>
    '<span class="cbp-pill">' + p + '</span>'
  ).join('');
})();
</script>
</body>
